name: Update channels
on:
  schedule:
    - cron: "0 3 * * 1"   # по понедельникам, 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yt-dlp
      - name: Collect channels
        run: python tools/collect_channels.py -n 60 --min-videos 2 --out out_auto
      - name: Merge into channels_auto.txt
        run: python tools/merge_channels.py out_auto/channels.txt channels_auto.txt
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add channels_auto.txt
          git diff --cached --quiet || (git commit -m "Обновление списка каналов [skip ci]" && git push)
